name: CI & Release Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  rust-core:
    name: Build Rust Engine Daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev gcc-mingw-w64-x86-64

      - name: Run Rust unit and integration tests
        run: cargo test --manifest-path RMouseButtonControl/Cargo.toml

      - name: Build Linux daemon binary
        run: cargo build --manifest-path RMouseButtonControl/Cargo.toml --release

      - name: Build Windows daemon binary
        run: cargo build --manifest-path RMouseButtonControl/Cargo.toml --target x86_64-pc-windows-gnu --release

      - name: Upload Linux daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmousebuttoncontrol-linux-x64
          path: RMouseButtonControl/target/release/rmousebuttoncontrol

      - name: Upload Windows daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmousebuttoncontrol-windows-x64
          path: RMouseButtonControl/target/x86_64-pc-windows-gnu/release/rmousebuttoncontrol.exe

  qt-gui:
    name: Build Qt6 Native GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev cmake g++

      - name: Configure and build Qt GUI
        run: |
          cmake -B build -S gui -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(nproc)

      - name: Upload Qt GUI Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmouse-gui-linux-x64
          path: build/rmouse-gui

  qt-gui-windows:
    name: Build Qt6 Native GUI (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Build Qt GUI (Windows)
        shell: msys2 {0}
        run: |
          cmake -B build-win -S gui -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win
          windeployqt-qt6 build-win/rmouse-gui.exe --no-translations --compiler-runtime || windeployqt build-win/rmouse-gui.exe --no-translations --compiler-runtime

      - name: Upload Qt GUI Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmouse-gui-windows-x64
          path: build-win/

  avalonia-gui:
    name: Build C# Avalonia GUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Linux Avalonia GUI
        run: |
          dotnet publish YMouseButtonControl/YMouseButtonControl.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            -o publish/linux-x64

      - name: Publish Windows Avalonia GUI
        run: |
          dotnet publish YMouseButtonControl/YMouseButtonControl.csproj \
            -c Release \
            -r win-x64 \
            --self-contained \
            -o publish/win-x64

      - name: Upload Avalonia Linux GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmouse-avalonia-gui-linux-x64
          path: publish/linux-x64/

      - name: Upload Avalonia Windows GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmouse-avalonia-gui-win-x64
          path: publish/win-x64/

  release-packages:
    name: Package 4 Release Bundles
    needs: [rust-core, qt-gui, qt-gui-windows, avalonia-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package 4 Release Bundles
        run: |
          mkdir -p release-output

          # 1. Linux Qt (Rust + Qt)
          mkdir -p pkg-lin-qt
          cp artifacts/rmousebuttoncontrol-linux-x64/rmousebuttoncontrol pkg-lin-qt/
          cp artifacts/rmouse-gui-linux-x64/rmouse-gui pkg-lin-qt/
          cp README.md README.ru.md pkg-lin-qt/
          chmod +x pkg-lin-qt/rmousebuttoncontrol pkg-lin-qt/rmouse-gui
          tar -czf release-output/RMouseButtonControl-Linux-Qt.tar.gz -C pkg-lin-qt .

          # 2. Linux Full (Rust + Qt + C# Avalonia)
          mkdir -p pkg-lin-full
          cp artifacts/rmousebuttoncontrol-linux-x64/rmousebuttoncontrol pkg-lin-full/
          cp artifacts/rmouse-gui-linux-x64/rmouse-gui pkg-lin-full/
          mkdir -p pkg-lin-full/csharp-gui
          cp -r artifacts/rmouse-avalonia-gui-linux-x64/* pkg-lin-full/csharp-gui/
          cp README.md README.ru.md pkg-lin-full/
          chmod +x pkg-lin-full/rmousebuttoncontrol pkg-lin-full/rmouse-gui pkg-lin-full/csharp-gui/YMouseButtonControl
          tar -czf release-output/RMouseButtonControl-Linux-Full.tar.gz -C pkg-lin-full .

          # 3. Windows Qt (Rust + Qt)
          sudo apt-get install -y zip
          mkdir -p pkg-win-qt
          cp artifacts/rmousebuttoncontrol-windows-x64/rmousebuttoncontrol.exe pkg-win-qt/
          cp -r artifacts/rmouse-gui-windows-x64/* pkg-win-qt/
          cp README.md README.ru.md pkg-win-qt/
          (cd pkg-win-qt && zip -r ../release-output/RMouseButtonControl-Windows-Qt.zip .)

          # 4. Windows Full (Rust + Qt + C# Avalonia)
          mkdir -p pkg-win-full
          cp artifacts/rmousebuttoncontrol-windows-x64/rmousebuttoncontrol.exe pkg-win-full/
          cp -r artifacts/rmouse-gui-windows-x64/* pkg-win-full/
          mkdir -p pkg-win-full/csharp-gui
          cp -r artifacts/rmouse-avalonia-gui-win-x64/* pkg-win-full/csharp-gui/
          cp README.md README.ru.md pkg-win-full/
          (cd pkg-win-full && zip -r ../release-output/RMouseButtonControl-Windows-Full.zip .)

      - name: Upload Release Bundles Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles-4
          path: release-output/*
