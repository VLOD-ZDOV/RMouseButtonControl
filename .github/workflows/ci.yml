name: CI & Release Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  rust-core:
    name: Build Rust Engine Daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev gcc-mingw-w64-x86-64

      - name: Run Rust unit and integration tests
        run: cargo test --manifest-path RMouseButtonControl/Cargo.toml

      - name: Build Linux daemon binary
        run: cargo build --manifest-path RMouseButtonControl/Cargo.toml --release

      - name: Build Windows daemon binary
        run: cargo build --manifest-path RMouseButtonControl/Cargo.toml --target x86_64-pc-windows-gnu --release

      - name: Upload Linux daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmousebuttoncontrol-linux-x64
          path: RMouseButtonControl/target/release/rmousebuttoncontrol

      - name: Upload Windows daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmousebuttoncontrol-windows-x64
          path: RMouseButtonControl/target/x86_64-pc-windows-gnu/release/rmousebuttoncontrol.exe

  qt-gui:
    name: Build Qt6 Native GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev cmake g++

      - name: Configure and build Qt GUI
        run: |
          cmake -B build -S gui -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j $(nproc)

      - name: Upload Qt GUI Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmouse-gui-linux-x64
          path: build/rmouse-gui

  qt-gui-windows:
    name: Build Qt6 Native GUI (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Build Qt GUI (Windows)
        shell: msys2 {0}
        run: |
          cmake -B build-win -S gui -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win
          windeployqt-qt6 build-win/rmouse-gui.exe --no-translations --compiler-runtime || windeployqt build-win/rmouse-gui.exe --no-translations --compiler-runtime

      - name: Upload Qt GUI Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmouse-gui-windows-x64
          path: build-win/

  avalonia-gui:
    name: Build C# Avalonia GUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Linux Avalonia GUI
        run: |
          dotnet publish YMouseButtonControl/YMouseButtonControl.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            -o publish/linux-x64

      - name: Publish Windows Avalonia GUI
        run: |
          dotnet publish YMouseButtonControl/YMouseButtonControl.csproj \
            -c Release \
            -r win-x64 \
            --self-contained \
            -o publish/win-x64

      - name: Upload Avalonia Linux GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmouse-avalonia-gui-linux-x64
          path: publish/linux-x64/

      - name: Upload Avalonia Windows GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmouse-avalonia-gui-win-x64
          path: publish/win-x64/

  release-packages:
    name: Package Release Bundles & Setup
    needs: [rust-core, qt-gui, qt-gui-windows, avalonia-gui]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build Windows Setup and Package Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force

          # 1. Prepare bundle-win-qt (Clean portable Windows bundle)
          New-Item -ItemType Directory -Path bundle-win-qt -Force
          Copy-Item artifacts\rmousebuttoncontrol-windows-x64\rmousebuttoncontrol.exe bundle-win-qt\
          Copy-Item artifacts\rmouse-gui-windows-x64\* bundle-win-qt\ -Recurse
          Copy-Item README.md, README.ru.md bundle-win-qt\

          # Remove temporary CMake build files from Windows package
          Remove-Item -Path bundle-win-qt\CMakeFiles, bundle-win-qt\rmouse-gui_autogen -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path bundle-win-qt\CMakeCache.txt, bundle-win-qt\cmake_install.cmake, bundle-win-qt\build.ninja, bundle-win-qt\.ninja_* -Force -ErrorAction SilentlyContinue

          # 2. Build Inno Setup Installer: dist\RMouseButtonControl-Windows-Setup.exe
          if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (!(Test-Path $isccPath)) {
              choco install innosetup --no-progress -y
            }
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc scripts\installer.iss

          # 3. Create Windows Portable: dist\RMouseButtonControl-Windows-Portable.zip & dist\RMouseButtonControl-Windows-Qt.zip
          Compress-Archive -Path bundle-win-qt\* -DestinationPath dist\RMouseButtonControl-Windows-Portable.zip -Force
          Copy-Item dist\RMouseButtonControl-Windows-Portable.zip dist\RMouseButtonControl-Windows-Qt.zip -Force

          # 4. Create Windows Full: dist\RMouseButtonControl-Windows-Full.zip
          New-Item -ItemType Directory -Path bundle-win-full -Force
          Copy-Item bundle-win-qt\* bundle-win-full\ -Recurse
          New-Item -ItemType Directory -Path bundle-win-full\csharp-gui -Force
          Copy-Item artifacts\rmouse-avalonia-gui-win-x64\* bundle-win-full\csharp-gui\ -Recurse
          Compress-Archive -Path bundle-win-full\* -DestinationPath dist\RMouseButtonControl-Windows-Full.zip -Force

          # 5. Create Linux Qt package: dist\RMouseButtonControl-Linux-Qt.tar.gz
          New-Item -ItemType Directory -Path bundle-lin-qt -Force
          Copy-Item artifacts\rmousebuttoncontrol-linux-x64\rmousebuttoncontrol bundle-lin-qt\
          Copy-Item artifacts\rmouse-gui-linux-x64\rmouse-gui bundle-lin-qt\
          Copy-Item README.md, README.ru.md bundle-lin-qt\
          tar -czf dist/RMouseButtonControl-Linux-Qt.tar.gz -C bundle-lin-qt .

          # 6. Create Linux Full package: dist\RMouseButtonControl-Linux-Full.tar.gz
          New-Item -ItemType Directory -Path bundle-lin-full -Force
          Copy-Item artifacts\rmousebuttoncontrol-linux-x64\rmousebuttoncontrol bundle-lin-full\
          Copy-Item artifacts\rmouse-gui-linux-x64\rmouse-gui bundle-lin-full\
          New-Item -ItemType Directory -Path bundle-lin-full\csharp-gui -Force
          Copy-Item artifacts\rmouse-avalonia-gui-linux-x64\* bundle-lin-full\csharp-gui\ -Recurse
          Copy-Item README.md, README.ru.md bundle-lin-full\
          tar -czf dist/RMouseButtonControl-Linux-Full.tar.gz -C bundle-lin-full .

      - name: Upload Release Bundles Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles-all
          path: dist/*
